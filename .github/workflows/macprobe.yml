name: macOS Probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          echo "runner ok: $RUNNER_OS / $RUNNER_ARCH"
          sw_vers
          xcodebuild -version